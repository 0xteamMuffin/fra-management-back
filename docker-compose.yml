version: '3.8'
services:
  db:
    image: postgis/postgis:16-3.5
    restart: always
    environment:
      POSTGRES_USER: diwisen_user
      POSTGRES_PASSWORD: diwisen_password
      POSTGRES_DB: diwisen_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
